<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Maritieme Incident App</title>

<style>

body{
    font-family: Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.tab{
    padding:10px 15px;
    margin-right:5px;
    cursor:pointer;
}

.page{
    display:none;
    margin-top:20px;
}

.active{
    display:block;
}

#messages{
    border:1px solid #ccc;
    height:400px;
    overflow-y:auto;
    padding:10px;
}

.message{
    border-bottom:1px solid #eee;
    padding:5px;
}

input,textarea,button{
    padding:10px;
    margin:5px;
}

canvas{
    border:1px solid #000;
    max-width:100%;
}

</style>
</head>
<body>

<h1>🚤 Maritieme Incident App</h1>

<button class="tab" onclick="showPage('chat')">Chat</button>
<button class="tab" onclick="showPage('form')">Formulier</button>
<button class="tab" onclick="showPage('kaart')">Kaart</button>

<!-- CHAT -->

<div id="chat" class="page active">

<h2>Logboek</h2>

<input id="name" placeholder="Naam">

<input id="message" placeholder="Bericht">

<button onclick="sendMessage()">
Versturen
</button>

<div id="messages"></div>

</div>

<!-- FORM -->

<div id="form" class="page">

<h2>Situatieformulier</h2>

<p>Status</p>
<input id="veld1">

<p>Locatie</p>
<input id="veld2">

<p>Opmerking</p>
<textarea id="veld3" rows="5" cols="50"></textarea>

<br>

<button onclick="saveForm()">
Opslaan
</button>

</div>

<!-- KAART -->

<div id="kaart" class="page">

<h2>Plattegrond</h2>

<canvas id="canvas" width="900" height="600"></canvas>

<br>

<button onclick="saveDrawing()">
Tekening Opslaan
</button>

<button onclick="clearCanvas()">
Wissen
</button>

</div>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const supabase = createClient(
'YOUR_SUPABASE_URL',
'YOUR_PUBLISHABLE_KEY'
);

window.showPage = function(id){

 document
 .querySelectorAll('.page')
 .forEach(x=>x.classList.remove('active'));

 document
 .getElementById(id)
 .classList.add('active');

}

/* CHAT */

const messagesDiv=
document.getElementById("messages");

function addMessage(msg){

 const div=
 document.createElement("div");

 const time=
 new Date(msg.created_at)
 .toLocaleTimeString();

 div.className="message";

 div.innerHTML=
 `<small>${time}</small><br>
 <strong>${msg.username}</strong>
 : ${msg.message}`;

 messagesDiv.prepend(div);

}

async function loadMessages(){

 const {data} =
 await supabase
 .from('messages')
 .select('*')
 .order('created_at',
 {
  ascending:false
 });

 messagesDiv.innerHTML='';

 data.forEach(addMessage);

}

window.sendMessage=async()=>{

 const username=
 document.getElementById('name').value;

 const message=
 document.getElementById('message').value;

 if(!username || !message)return;

 await supabase
 .from('messages')
 .insert({
  username,
  message
 });

 document.getElementById('message').value='';

}

supabase
.channel('messages')
.on(
 'postgres_changes',
 {
  event:'INSERT',
  schema:'public',
  table:'messages'
 },
 payload=>{
  addMessage(payload.new);
 }
)
.subscribe();

/* FORMULIER */

async function loadForm(){

 const {data} =
 await supabase
 .from('form_data')
 .select('*')
 .eq('id',1)
 .single();

 document.getElementById('veld1').value =
 data.veld1 || '';

 document.getElementById('veld2').value =
 data.veld2 || '';

 document.getElementById('veld3').value =
 data.veld3 || '';

}

window.saveForm=async()=>{

 await supabase
 .from('form_data')
 .update({
   veld1:
   document.getElementById('veld1').value,

   veld2:
   document.getElementById('veld2').value,

   veld3:
   document.getElementById('veld3').value
 })
 .eq('id',1);

 alert('Opgeslagen');

}

/* CANVAS */

const canvas =
document.getElementById('canvas');

const ctx=
canvas.getContext('2d');

const img=
new Image();

img.src='plattegrond.png';

img.onload=()=>{

 ctx.drawImage(
  img,
  0,
  0,
  canvas.width,
  canvas.height
 );

 loadDrawing();

};

let drawing=false;

canvas.addEventListener(
'mousedown',
()=>drawing=true);

canvas.addEventListener(
'mouseup',
()=>drawing=false);

canvas.addEventListener(
'mousemove',
e=>{

 if(!drawing)return;

 ctx.fillRect(
  e.offsetX,
  e.offsetY,
  3,
  3
 );

});

window.clearCanvas=()=>{

 ctx.clearRect(
  0,
  0,
  canvas.width,
  canvas.height
 );

 ctx.drawImage(
  img,
  0,
  0,
  canvas.width,
  canvas.height
 );

}

window.saveDrawing=async()=>{

 const image=
 canvas.toDataURL();

 await supabase
 .from('drawings')
 .insert({
  drawing:image
 });

 alert('Tekening opgeslagen');

}

async function loadDrawing(){

 const {data} =
 await supabase
 .from('drawings')
 .select('*')
 .order(
  'created_at',
  {ascending:false}
 )
 .limit(1);

 if(!data.length)return;

 const drawingImage =
 new Image();

 drawingImage.src =
 data[0].drawing;

 drawingImage.onload=()=>{

  ctx.drawImage(
   drawingImage,
   0,
   0,
   canvas.width,
   canvas.height
  );

 };

}

/* START */

loadMessages();
loadForm();

</script>

</body>
</html>
